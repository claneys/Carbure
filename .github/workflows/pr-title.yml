name: PR title

# The pull requests are squash-merged: their title becomes the commit of main. It must
# follow Conventional Commits (see AGENTS.md): "type(scope): description", English,
# imperative, lowercase start, no final period. Only the title is read: no code of the
# pull request is checked out or run, no token is needed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title of the pull request
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|security|perf|refactor|docs|test|ci|chore|build|revert'
          pattern="^($types)(\([a-z0-9._/-]+\))?!?: [^A-Z[:space:]](.*[^.[:space:]])?$"
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Conventional Commits title: OK"
            exit 0
          fi
          {
            echo "::error title=PR title::The title must follow Conventional Commits: 'type(scope): description'"
            echo "- type: ${types//|/, }"
            echo "- optional scope in parentheses (api, portal, sync, docker, deps…), optional '!' for a breaking change"
            echo "- the description starts with a lowercase letter and does not end with a period"
          }
          exit 1
