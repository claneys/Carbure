name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        run: find src tests swagger tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Development tools (Composer)
        run: composer install --no-interaction --no-progress

      - name: PHP types (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript syntax (portal ES modules)
        run: |
          for file in $(find portal -name '*.js'); do
            cp "$file" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "::error file=$file::JavaScript syntax error"; exit 1; }
          done

      - name: Portal unit tests
        run: node --test 'tests/portal/*.test.mjs'

      - name: CSS braces balanced
        run: |
          python3 - <<'PY'
          import sys
          css = open('portal/style.css', encoding='utf-8').read()
          depth = css.count('{') - css.count('}')
          if depth:
              print(f"::error file=portal/style.css::unbalanced braces ({depth:+d})")
              sys.exit(1)
          PY

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (release archive: PHP 8.2 or later), version of the
        # Docker image (coverage), newest version (deprecations)
        php: ['8.2', '8.3', '8.5']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      REQUIRE_DB: 1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl, openssl, apcu
          ini-values: apc.enable_cli=1
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}

      - name: Unit and integration tests
        if: matrix.php != '8.3'
        run: php tools/phpunit.phar

      - name: Tests with coverage
        if: matrix.php == '8.3'
        run: php tools/phpunit.phar --coverage-clover coverage.xml --coverage-text

      - name: Coverage >= 90 %
        if: matrix.php == '8.3'
        run: php tools/coverage-check.php coverage.xml 90

      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.3' && always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (portal)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 3306
      E2E_DB_USER: root
      E2E_DB_PASSWORD: root
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, openssl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the PHP built-in server with the e2e router (tests/e2e/server)
      - name: Portal tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/.data/logs/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload of the scan results to the Security tab
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Build the image
        run: docker compose -f docker/docker-compose.yml build carbure

      # Security of the image: OS packages (Alpine), PHP dependencies, secrets left in the
      # image. The build fails on a CRITICAL vulnerability that has a fix. woob and its
      # Python dependencies (/opt/woob) are not scanned: they follow the woob releases.
      - name: Scan the image (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ltoinel/carbure:latest
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore
          skip-dirs: /opt/woob

      - name: Scan the image (report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ltoinel/carbure:latest
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          # Without it, the SARIF report keeps every severity (low, unknown)
          limit-severities-for-sarif: true
          # Only what can be fixed by an update of the image
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
          skip-dirs: /opt/woob
          skip-setup-trivy: true

      - name: Publish the scan in the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Start Carbure and MariaDB
        env:
          DB_PASSWORD: ci-db-password
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for the portal
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/portal/ > /dev/null && exit 0
            sleep 3
          done
          exit 1

      - name: Installation wizard
        run: |
          set -e
          # Not installed: only the wizard answers, with the database of docker compose
          curl -fsS http://localhost:8080/api/setup | tee /dev/stderr | grep -q '"dbPasswordFromEnvironment":true'
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"setup"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/transaction)" = 503
          # Same steps as the portal (the password of the database comes from Docker)
          fields='"db_host":"db","db_port":3306,"db_name":"carbure","db_user":"carbure","db_password":""'
          curl -fsS -X POST http://localhost:8080/api/setup/database -H 'Content-Type: application/json' \
            -d "{$fields}" | tee /dev/stderr | grep -q '"state":"none"'
          curl -fsS -X POST http://localhost:8080/api/setup/install -H 'Content-Type: application/json' \
            -d "{$fields,\"admin_user\":\"admin\",\"admin_password\":\"ci-admin-password\",\"language\":\"fr\"}" \
            | tee /dev/stderr | grep -q '"done":true'
          # Healthy before and after the installation
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          # Installed: the wizard is gone
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/setup)" = 404

      - name: Smoke test
        run: |
          set -e
          # Login with the administrator created by the wizard
          token=$(curl -fsS -X POST http://localhost:8080/api/user/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          # Authenticated call
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/user/me | grep -q '"username": *"admin"'
          # Without a token: 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/transaction)" = 401
          # Private files are never served
          for path in /data/conf/prod.ini /data/conf/setup.code /data/logs/ /data/woob/ /conf/prod.sample.ini /sql/carbure.sql /tools/migrate.php /src/lib/Config.php /src/api.php /README.md; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            test "$code" = 403 || test "$code" = 404
          done
          # Restart: the schema is checked and kept (no migration to apply)
          docker compose -f docker/docker-compose.yml restart carbure
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/portal/ > /dev/null && break
            sleep 2
          done
          docker compose -f docker/docker-compose.yml logs carbure | grep -q 'schema version'
          # Security headers of the portal and the API
          curl -fsSI http://localhost:8080/portal/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://localhost:8080/portal/ | grep -qi 'x-frame-options: DENY'
          curl -sI http://localhost:8080/api/health | grep -qi 'cache-control: no-store'
          ! curl -sI http://localhost:8080/api/health | grep -qi 'x-powered-by'
          # woob and curl_cffi are installed
          docker compose -f docker/docker-compose.yml exec -T carbure woob --version
          docker compose -f docker/docker-compose.yml exec -T carbure /opt/woob/bin/python -c 'import curl_cffi'

      - name: Logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

