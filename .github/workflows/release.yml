name: Release

# Started by pushing a tag (git tag v1.2.0 && git push origin v1.2.0): CI, Docker image,
# then the release is created with its archives and generated notes in one go. The
# releases of the repository are immutable: no file can be attached once published.
# A tag with a suffix (v1.2.0-rc.1) gives a pre-release. "Run workflow" rebuilds the
# Docker image of an existing tag (its release, immutable, is left as is).
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.2.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      # The tag must be an existing semantic version. Rebuilding an old tag must not move
      # back the tags "latest" (highest release) and "1.2" (highest release of 1.2.x)
      - id: check
        name: Check the tag and find the moving tags of the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::The tag must be a semantic version (v1.2.0, 1.2.0, v1.2.0-rc.1)"
            exit 1
          fi
          tags=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name')
          if ! grep -qxF -- "$TAG" <<< "$tags"; then
            echo "::error::This tag does not exist in the repository"
            exit 1
          fi
          version="${TAG#v}"
          releases=$(grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" | sed 's/^v//' | sort -V || true)
          highest=$(tail -n 1 <<< "$releases")
          base="${version%%-*}"
          minor_prefix="${base%.*}."
          highest_minor=$(grep -E "^${minor_prefix//./\\.}[0-9]+$" <<< "$releases" | tail -n 1 || true)
          latest=false
          minor=false
          if [ "$PRERELEASE" != true ] && [ "$version" = "$highest" ]; then
            latest=true
          fi
          if [ "$PRERELEASE" != true ] && [ "$version" = "$highest_minor" ]; then
            minor=true
          fi
          echo "Highest release: $highest, of ${minor_prefix}x: $highest_minor"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    # A reused workflow gets at most the permissions of its caller: those of the CI
    # (publication of the image scan in the Security tab). The secret scan is in the
    # Security workflow: the released commit was scanned on main
    permissions:
      contents: read
      security-events: write

  release:
    name: Release archives
    # Published once the Docker image is available
    needs: [ci, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # git archive works on the local clone: the git credentials are not needed (the
      # release is created by gh with GH_TOKEN)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}

      - name: Build the archive
        run: |
          # carbure-1.2.0 for the tag 1.2.0 or v1.2.0
          name="carbure-${TAG#v}"
          mkdir -p dist build
          git archive --format=tar --prefix="$name/" HEAD \
            src portal swagger sql conf/prod.sample.ini tools/migrate.php README.md README.en.md LICENSE \
            | tar -x -C build
          # Version shown in the footer of the portal and by /api/health
          echo "${TAG#v}" > "build/$name/VERSION"
          tar -czf "dist/$name.tar.gz" -C build "$name"
          (cd build && zip -qr "../dist/$name.zip" "$name")
          (cd dist && sha256sum -- * > SHA256SUMS)

      # gh creates a draft, uploads the archives, then publishes it: the release is
      # complete when it becomes immutable
      - name: Publish the release with its archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG already exists (immutable): left as is"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --title "Carbure $TAG" --generate-notes --verify-tag "${flags[@]}"

  docker:
    name: Docker image
    needs: [tag, ci]
    runs-on: ubuntu-latest
    # Usually under 10 minutes (two architectures, arm64 emulated by QEMU)
    timeout-minutes: 60
    permissions:
      contents: read
      # Signed attestation of the build provenance of the image (artifact attestation)
      id-token: write
      attestations: write
    steps:
      # Docker Hub account: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token
      # with Read & Write), image docker.io/ltoinel/carbure
      - name: Check the Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/ltoinel/carbure
          # 1.2.0 and v1.2.0 give the tag 1.2.0; 1.2 only for the highest 1.2.x release
          # and latest only for the highest release (never for a pre-release): see the
          # job "Check the tag"
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.tag.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.tag.outputs.latest == 'true' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CARBURE_VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Bill of materials and build provenance attached to the image
          sbom: true
          provenance: mode=max

      # Provenance signed by GitHub (Sigstore), pushed next to the image on Docker Hub:
      # gh attestation verify oci://docker.io/ltoinel/carbure:<version> --owner ltoinel
      # No storage record: only available for the repositories of an organization
      - name: Attest the provenance of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/ltoinel/carbure
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Demo image (docker/demo/Dockerfile): the image just pushed, with MariaDB and the
      # demonstration data inside (docker run --rm -p 8080:80 ltoinel/carbure:demo).
      # <version>-demo for each release, demo with latest (highest release)
      - id: meta-demo
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/ltoinel/carbure
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},suffix=-demo
            type=raw,value=demo,enable=${{ needs.tag.outputs.latest == 'true' }}

      - id: build-demo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The regular image of this release, by its digest
          build-args: |
            BASE=docker.io/ltoinel/carbure@${{ steps.build.outputs.digest }}
          tags: ${{ steps.meta-demo.outputs.tags }}
          sbom: true
          provenance: mode=max

      - name: Attest the provenance of the demo image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/ltoinel/carbure
          subject-digest: ${{ steps.build-demo.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
