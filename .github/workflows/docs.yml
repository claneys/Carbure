name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'overrides/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'tools/check-docs-english.sh']
  pull_request:
    paths: ['docs/**', 'overrides/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'tools/check-docs-english.sh']
  workflow_dispatch:

permissions:
  contents: read

# One group per branch: the builds of a pull request never wait for (or block) the
# deployments of main. Only the deploy job shares the "pages" group, never cancelled
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base of a pull request, to compare its French and English pages
          fetch-depth: 0

      - name: English version of each page
        env:
          BASE_REF: ${{ github.base_ref }}
        run: tools/check-docs-english.sh ${BASE_REF:+origin/$BASE_REF}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site
          # .well-known/ (Universal Links, App Links) is a hidden directory
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
