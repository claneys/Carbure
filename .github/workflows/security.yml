name: Security

# Security checks, with their own badge in the README:
# - secrets committed in the history (gitleaks), on each pull request and push on main;
# - known vulnerabilities of the dependencies of the repository (Trivy), same triggers;
# - security issues of the PHP code (Semgrep: CodeQL does not support PHP), same triggers;
# - known vulnerabilities of the image published on Docker Hub (Trivy), every week: new
#   vulnerabilities are published without any change of Carbure.
# The image built by each pull request is scanned by the CI (job "Docker image").
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday, 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Only a new push on a pull request cancels the previous run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload of the scan results to the Security tab
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lock files of the repository (Playwright, MkDocs): fails on a CRITICAL
      # vulnerability that has a fix
      - name: Scan the dependencies (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Scan the dependencies (report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-dependencies.sarif
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Publish the scan in the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-dependencies.sarif
          category: trivy-dependencies

  php:
    name: PHP static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload of the scan results to the Security tab
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Semgrep CLI (pinned), PHP rules of the public registry (p/php: injections, unsafe
      # functions, crypto, deserialization...), no account nor metrics. Fails on any finding
      # (none on main), the SARIF report being published in any case
      - name: Scan the PHP code
        run: |
          pip install --quiet semgrep==1.181.0
          semgrep scan --config p/php --metrics=off --error --sarif --output semgrep-php.sarif src tools swagger

      - name: Publish the scan in the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep-php.sarif
          category: semgrep-php

  published-image:
    name: Published image scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # .trivyignore of the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same rules as the scan of the CI: a CRITICAL vulnerability that has a fix means
      # that a new release (rebuilt image) is needed
      - name: Scan the image of Docker Hub (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ltoinel/carbure:latest
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore
          skip-dirs: /opt/woob

      - name: Scan the image of Docker Hub (report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ltoinel/carbure:latest
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-published-image.sarif
          trivyignores: .trivyignore
          skip-dirs: /opt/woob
          skip-setup-trivy: true

      - name: Publish the scan in the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-published-image.sarif
          category: trivy-published-image
