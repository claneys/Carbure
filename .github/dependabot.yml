# Conventional Commits titles (see CONTRIBUTING.md): "ci(deps): …", "chore(deps): …"
# Cooldown: a new version is only proposed 7 days after its publication (time for a
# compromised or broken release to be spotted and withdrawn); security updates are not
# delayed.
# Not covered: the mariadb image of the "services" of ci.yml (Dependabot does not read
# the services of a workflow): updated by hand (10.11, an LTS older than the image of
# docker-compose.yml).
version: 2
updates:
  # GitHub Actions — also keeps SHA-pinned actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker base images (php:8.5-fpm-alpine)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Images referenced in docker-compose files
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Development tools (PHPStan, PHPUnit)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # End-to-end tests (portal)
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      e2e:
        patterns: ["*"]
    commit-message:
      prefix: "test"
      include: "scope"

  # MkDocs documentation
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: "docs"
      include: "scope"
