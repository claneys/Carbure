<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbure API Documentation</title>
    <!-- Swagger UI is served with the project (vendor/README.md): no external CDN -->
    <link rel="stylesheet" type="text/css" href="vendor/swagger-ui/swagger-ui.css" />
    <!-- Contrasts of its light theme (WCAG AA) -->
    <link rel="stylesheet" type="text/css" href="carbure.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        /* The bar of Swagger UI (URL of the description, its own theme toggle) is hidden:
           a <header>, shown by the normalize rules of swagger-ui.css without this selector */
        .swagger-ui .topbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="vendor/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script src="swagger-init.js"></script>
</body>
</html>
