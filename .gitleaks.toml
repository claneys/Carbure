# gitleaks configuration: default rules + known test fixtures
[extend]
useDefault = true

# Single [allowlist] table: understood by gitleaks 8.24 (GitHub action) and newer
[allowlist]
description = "Fake values used by the tests (not secrets)"
regexes = [
    # APNs device token (tests/integration)
    '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90''',
    # jwtsecret of the configuration file of SettingsTest
    '''^0123456789abcdef$''',
    # Fake API key of the push service (tests/integration/SettingsTest.php)
    '''cpk_0123456789abcdef_''',
]
