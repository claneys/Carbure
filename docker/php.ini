; Carbure PHP settings
expose_php = Off
display_errors = Off
; The stack traces of the exceptions keep no argument (passwords of the banks, logins)
zend.exception_ignore_args = On
log_errors = On
; Synchronization progress is streamed (Server-Sent Events)
output_buffering = Off
zlib.output_compression = Off
max_execution_time = 0
memory_limit = 256M
; Import of a backup (nginx accepts up to 32 MB on /api/backup/import, 2 MB elsewhere)
post_max_size = 32M
apc.enabled = 1
