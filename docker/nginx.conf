# Carbure: the portal, Swagger and the API are the only public paths
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/carbure;

    client_max_body_size 2m;

    # Relative redirects: the container listens on 80 but is published on another
    # port (8080) or behind a proxy, so an absolute Location would lose the port.
    absolute_redirect off;

    # Security headers of the portal and Swagger (the API sets its own, see
    # Webservice::securityHeaders).
    # Vue compiles the templates of the page in the browser: 'unsafe-eval' is needed.
    # No external CDN: every script, style, font and image is served with the project
    # (portal/vendor, swagger/vendor), and the portal only calls its own API ('self').
    # HSTS belongs to the HTTPS reverse proxy in front of the container.
    set $csp_portal "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Home -> portal
    location = / {
        return 302 /portal/;
    }

    location /portal/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp_portal always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Web App Manifest (the portal installed as an app): its media type is missing
        # from the mime.types of nginx. Same security headers (inherited from above).
        location ~ \.webmanifest$ {
            types { application/manifest+json webmanifest; }
        }
    }

    # OpenAPI description of the API, generated by PHP (never served as a file)
    location = /swagger/swagger.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/swagger/swagger.php;
        fastcgi_param SCRIPT_NAME /swagger/swagger.php;
        fastcgi_pass 127.0.0.1:9000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /swagger/ {
        try_files $uri $uri/ =404;
        # Swagger UI is served with the project (swagger/vendor): nothing from another site
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API: every /api/... request is handled by src/api.php
    # OAuth metadata of the MCP server (AI agents connectors), answered by the API
    location ^~ /.well-known/oauth- {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
        fastcgi_param SCRIPT_NAME /src/api.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
        fastcgi_param SCRIPT_NAME /src/api.php;
        fastcgi_pass 127.0.0.1:9000;
        # The synchronization is long and streamed (Server-Sent Events)
        fastcgi_read_timeout 3600s;
        fastcgi_buffering off;
        gzip off;
    }

    # Everything else (configuration, logs, sources, SQL...) is never served
    location / {
        return 404;
    }
}
