; Configuration of the end-to-end tests of the portal (tests/e2e, APP_ENV=e2e).
; The database settings come from the environment (see tests/e2e/server/router.php).

[global]
log_level=debug
development=true

[database]
db_hostname=127.0.0.1
db_username=root
db_password=""
db_name=carbure_e2e

[cleansing]
regex_label["/FACTURE CARTE DU \d{6}\s*/"]="CB "
regex_label["/\s(CARTE.*|CARTE|CART|CAR|CA|C)$/"]=""
regex_label["/(PRLV SEPA.*)(ECH.*|MDT.*)$/"]="$1"

[auth]
jwtsecret=e2e-tests-only-not-a-real-secret-xxxxxxxxxxxx
password_salt=e2e

[woob]
; Replaced by the fake woob of the tests (tests/fixtures/fake-woob.php)
woob_path=woob
woob_transactions=100
woob_logging=debug
woob_debug=false
woob_auto_update=false
woob_2fa_wait=0
woob_2fa_retries=1

[push]
; No API key: push unavailable; the push service is the fake one of the specs
; (CARBURE_PUSH_URL of the server, see playwright.config.js)
push_api_key=

[smtp]
; No SMTP server: the specs that send an email set one in Administration > Settings
; (a fake SMTP server started by the spec)
smtp_host=
smtp_port=2525
smtp_encryption=none
smtp_auth=none
smtp_username=
smtp_password=
smtp_from=
smtp_from_name=Carbure
