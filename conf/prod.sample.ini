[global]
log_level=warning
; Days the log files (data/logs) are kept: older ones are deleted at the end of the bank
; synchronization (0: kept forever)
log_retention_days=90
development=false
; Category whose transactions are the savings in the Trends tab (with its sub-categories;
; case and accents ignored)
savings_category=Epargne

[database]
db_hostname=localhost
db_port=3306
db_username=carbure
db_password=
db_name=carbure

[cleansing]
regex_label["/FACTURE CARTE DU \d{6}\s*/"]="CB "
regex_label["/\s(CARTE.*|CARTE|CART|CAR|CA|C)$/"]=""
regex_label["/(PRLV SEPA.*)(ECH.*|MDT.*)$/"]="$1"

[auth]
jwtsecret=secret
; Only used to check legacy SHA256 passwords (upgraded to bcrypt at login)
password_salt=secret
; Secret for the scheduler calling /api/bank/sync (X-Sync-Token header or ?token=)
sync_token=

[woob]
; Local Path
woob_path=/bin/woob

; With Docker Woob (https://hub.docker.com/repository/docker/ltoinel/woob/general)
; woob_path=docker run -v /volume1/web/carbure/woob/:/root/ ltoinel/woob:3.7 woob

woob_transactions=100
woob_logging=error
woob_debug=false
woob_auto_update=true
; Scheduled synchronization: when a bank asks a validation in its app, wait
; woob_2fa_wait seconds (0-300) then synchronize the account again, woob_2fa_retries times (0-5)
woob_2fa_wait=15
woob_2fa_retries=1

[apns]
; Apple Push Notification Service Configuration
apns_bundle_id=io.carbure.app

; Authentication method: 'token' (recommended) or 'certificate'
apns_auth_method=token

; Token-based authentication (use .p8 key from Apple Developer Portal)
apns_key_path=/path/to/AuthKey_XXXXXXXXXX.p8
apns_key_id=XXXXXXXXXX
apns_team_id=XXXXXXXXXX

; APNs environment: 'production' or 'sandbox'
apns_environment=production

[smtp]
; SMTP server of the notifications sent by email (Administration > Settings); the users
; choose the notifications they receive by email in their profile.
; Empty smtp_host (or smtp_from): no email is sent.
smtp_host=
; 587 for starttls, 465 for tls, 25 for none
smtp_port=587
; Encryption: 'none', 'starttls' or 'tls' (implicit TLS); the certificate is verified
smtp_encryption=starttls
; Authentication: 'none', 'plain' or 'login'
smtp_auth=plain
; e.g. carbure@example.com
smtp_username=
smtp_password=
; Sender of the emails, e.g. carbure@example.com
smtp_from=
smtp_from_name=Carbure
