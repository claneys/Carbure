[global]
log_level=warning
; Days the log files (data/logs) are kept: older ones are deleted at the end of the bank
; synchronization (0: kept forever)
log_retention_days=90
development=false
; Category whose transactions are the savings in the Trends tab (with its sub-categories;
; case and accents ignored)
savings_category=Epargne
; Currency of the amounts, shown in the portal, the notifications and the emails (ISO 4217
; code: EUR, USD, GBP, CHF, CAD...); only the display: no amount is converted
currency=EUR
; Day of the month from which a received transfer (the salary) counts for the next month:
; dated on this day or later, it is attached to the 1st of the next month, the month it pays
; for (its real date is kept). 1 to 31; 0: never. 25 when not set. Applied at import and
; synchronization, not to the transactions already saved
next_month_day=25
; Public address of Carbure (https://carbure.example.fr), given to the AI agents that
; connect through OAuth and to the mobile apps (QR code of My devices); inferred from the
; request when not set
;public_url=
; Banner of the administrators when a new release of Carbure is published: the server asks
; the public API of GitHub for the latest release once a day (nothing about the instance
; is sent). false: never asked
update_check=true
; Demonstration instance (Docker image ltoinel/carbure:demo): the login screen shows its
; public credentials. Never on an instance holding real data
;demo=false

[database]
db_hostname=localhost
db_port=3306
db_username=carbure
db_password=
db_name=carbure

[cleansing]
regex_label["/FACTURE CARTE DU \d{6}\s*/"]="CB "
regex_label["/(PRLV SEPA.*)(ECH.*|MDT.*)$/"]="$1"

[auth]
jwtsecret=secret
; Only used to check legacy SHA256 passwords (upgraded to bcrypt at login)
password_salt=secret
; Secret for the scheduler calling /api/bank/sync in the X-Sync-Token header (?token= in
; the URL is still accepted but deprecated: the URL ends up in the logs)
sync_token=
; Two-factor authentication at the login of every user (authenticator app: Google
; Authenticator...), not asked from a known iOS device or a browser trusted for 6 months
mfa_required=false

[woob]
; Local Path
woob_path=/bin/woob

; With Docker Woob (https://hub.docker.com/repository/docker/ltoinel/woob/general)
; woob_path=docker run -v /volume1/web/carbure/woob/:/root/ ltoinel/woob:3.7 woob

woob_transactions=100
woob_logging=error
woob_debug=false
woob_auto_update=true
; Scheduled synchronization: when a bank asks a validation in its app, wait
; woob_2fa_wait seconds (0-300) then synchronize the account again, woob_2fa_retries times (0-5)
woob_2fa_wait=15
woob_2fa_retries=1

[push]
; Push notifications of the iOS and Android apps, sent through Carbure Push
; (https://api.carbure.org, which holds the APNs and FCM credentials of the apps):
; Administration > Settings > "Register" gets the API key of this instance and saves it
; here. Empty push_api_key: no push notification is sent.
push_api_key=

[smtp]
; SMTP server of the notifications sent by email (Administration > Settings); the users
; choose the notifications they receive by email in their profile.
; Empty smtp_host (or smtp_from): no email is sent.
smtp_host=
; 587 for starttls, 465 for tls, 25 for none
smtp_port=587
; Encryption: 'none', 'starttls' or 'tls' (implicit TLS); the certificate is verified
smtp_encryption=starttls
; Authentication: 'none', 'plain' or 'login'
smtp_auth=plain
; e.g. carbure@example.com
smtp_username=
smtp_password=
; Sender of the emails, e.g. carbure@example.com
smtp_from=
smtp_from_name=Carbure
