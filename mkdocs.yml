site_name: Carbure
site_description: Portail web de suivi du budget et des transactions bancaires du foyer
site_url: https://carbure.org/
repo_url: https://github.com/ltoinel/Carbure
repo_name: ltoinel/Carbure
# Footer: author and license (the years of LICENSE)
copyright: >-
  Copyright &copy; 2023-2026 <a href="https://ludovic.toinel.com">Ludovic Toinel</a>
  · Logiciel libre sous <a href="https://github.com/ltoinel/Carbure/blob/main/LICENSE">licence MIT</a>
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  # Icon of the application in the header and the browser tab
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

# No "Made with Material for MkDocs" in the footer
extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Accueil: index.md
  - Fonctionnalités: fonctionnalites.md
  - Comparatif: comparatif.md
  - Architecture: architecture.md
  - Mise en route:
      - Installation: installation.md
      - NAS Synology: synology.md
      - Configuration: configuration.md
  - Utilisation:
      - API: api.md
      - Portail web: portail.md
      - Agents IA (MCP): mcp.md
  - Technique:
      - Modèle de données: modele-donnees.md
      - Développement: developpement.md
      - Sécurité: securite.md
