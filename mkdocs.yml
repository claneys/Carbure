site_name: Carbure
site_description: >-
  Gestionnaire de budget du foyer gratuit, open source et auto-hébergé : synchronisation
  bancaire automatique, catégories, budgets et tendances
site_author: Ludovic Toinel
site_url: https://carbure.org/
repo_url: https://github.com/ltoinel/Carbure
repo_name: ltoinel/Carbure
# Footer: author and license (the years of LICENSE)
copyright: >-
  Copyright &copy; 2023-2026 <a href="https://ludovic.toinel.com">Ludovic Toinel</a>
  · Logiciel libre sous <a href="https://github.com/ltoinel/Carbure/blob/main/LICENSE">licence MIT</a>
edit_uri: edit/main/docs/

theme:
  name: material
  # Page titles, Open Graph / Twitter metadata, structured data, French 404 page
  custom_dir: overrides
  language: fr
  # Icon of the application in the header and the browser tab
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

# Published but outside the navigation: the association files of the mobile apps
# (Universal Links, App Links) and the page their server links open without the app
exclude_docs: |
  !.well-known/
not_in_nav: |
  /app.md
  /app.en.md

plugins:
  - search:
      lang: [fr, en]
  # French at the root, English under /en/: page.md and its translation page.en.md; a page
  # not translated yet is shown in French. The language switch is in the header.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Free, open source and self-hosted household budget manager: automatic bank
            synchronization, categories, budgets and trends
          copyright: >-
            Copyright &copy; 2023-2026 <a href="https://ludovic.toinel.com">Ludovic Toinel</a>
            · Free software under the <a href="https://github.com/ltoinel/Carbure/blob/main/LICENSE">MIT license</a>
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Switch to light mode
          nav_translations:
            Accueil: Home
            Fonctionnalités: Features
            Recettes d'insights: Insight recipes
            Comparatif: Comparison
            Confidentialité: Privacy
            Mise en route: Getting started
            Configuration: Configuration
            Utilisation: Usage
            Portail web: Web portal
            Applications mobiles: Mobile apps
            Agents IA (MCP): AI agents (MCP)
            Technique: Technical
            Architecture: Architecture
            Modèle de données: Data model
            Développement: Development
            Sécurité: Security
            FAQ: FAQ
            Assistance: Support
          extra:
            generator: false
            demo_url: https://demo.carbure.org/
            discord_url: https://discord.gg/QsxYw4Rx9D
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/ltoinel/Carbure
                name: Source code on GitHub
              - icon: fontawesome/brands/discord
                link: https://discord.gg/QsxYw4Rx9D
                name: "Discord: help and chat"
              - icon: fontawesome/brands/youtube
                link: https://www.youtube.com/@carbure-org
                name: "Carbure videos on YouTube"
  # No external CDN: the fonts (Google Fonts) and any other external asset are
  # downloaded at build time and served with the site
  - privacy

# No "Made with Material for MkDocs" in the footer
extra:
  generator: false
  # Online demo and Discord server, linked from the header (overrides/partials/source.html)
  demo_url: https://demo.carbure.org/
  discord_url: https://discord.gg/QsxYw4Rx9D
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ltoinel/Carbure
      name: Code source sur GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/QsxYw4Rx9D
      name: "Discord : entraide et échanges"
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@carbure-org
      name: "Vidéos de Carbure sur YouTube"

extra_css:
  - stylesheets/extra.css

# Teaser of the home page: YouTube loaded only on click
extra_javascript:
  - javascripts/teaser.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Accueil: index.md
  - Fonctionnalités: fonctionnalites.md
  - Recettes d'insights: insights.md
  - Comparatif: comparatif.md
  - Confidentialité: confidentialite.md
  - Mise en route:
      - Installation: installation.md
      - NAS Synology: synology.md
      - Configuration: configuration.md
  - Utilisation:
      - Portail web: portail.md
      - Applications mobiles: applications-mobiles.md
      - Agents IA (MCP): mcp.md
  - Technique:
      - Architecture: architecture.md
      - API: api.md
      - Modèle de données: modele-donnees.md
      - Développement: developpement.md
      - Sécurité: securite.md
  - FAQ: faq.md
  - Assistance: assistance.md
